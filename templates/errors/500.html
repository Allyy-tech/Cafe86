{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
<div class="center-stage">
  <div class="auth-card" style="text-align:center">
    <div style="font-size:42px">&#9888;</div>
    <h1>Something went wrong</h1>
    <p class="muted">An unexpected error occurred. The details have been recorded in the server log.</p>
    <div style="margin-top:20px">
      <a class="btn btn-primary btn-block" href="{{ url_for('auth.landing') }}">Back to safety</a>
    </div>
  </div>
</div>
{% endblock %}
